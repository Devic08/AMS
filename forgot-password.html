<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMS Forgot Password - Asset Management System</title>
    <link rel="stylesheet" type="text/css" href="css/forgot-password.css">
</head>
<body>
    <div class="pageShell">
        <div class="forgotCard">
            <div class="forgotHeader">
                <h1>Forgot Password</h1>
                <p>Enter your account details below and we will help you reset your password.</p>
            </div>

            <form class="forgotForm" action="">
                <div class="formGroup">
                    <label for="email">Email Address</label>
                    <input id="email" type="email" placeholder="Enter your registered email" required>
                </div>

                <div class="formGroup">
                    <label for="newPassword">New Password</label>
                    <input id="newPassword" type="password" placeholder="Enter new password" required>
                </div>

                <div class="formGroup">
                    <label for="confirmPassword">Confirm Password</label>
                    <input id="confirmPassword" type="password" placeholder="Confirm new password" required>
                </div>

                <div class="buttonRow">
                    <button type="submit">Reset Password</button>
                </div>

                <div class="bottomLink">
                    <p>Remembered your password? <a href="login.html">Back to Login</a></p>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
