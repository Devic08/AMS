<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign License - AMS</title>
    <script src="script/theme-store.js?v=20260501a"></script>
    <script src="script/ams-database.js?v=20260502a"></script>
    <link rel="stylesheet" href="css/dashboard.css?v=20260501a">
    <link rel="stylesheet" href="css/sidebar-submenu.css">
    <link rel="stylesheet" href="css/inventory-assets.css">
    <link rel="stylesheet" href="css/predefined-fields.css">
    <link rel="stylesheet" href="css/theme-overrides.css?v=20260501a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <main class="inventoryFormPageMain">
        <section class="inventoryFormPageShell">
            <header class="predefinedHeader inventoryFormPageHeader">
                <a class="inventoryFormBackLink" href="inventory-license-info.html"><i class='bx bx-left-arrow-alt'></i><span>Back to License Info</span></a>
                <div>
                    <p class="predefinedEyebrow">Licenses</p>
                    <h2>Assign License</h2>
                    <p class="predefinedIntro">Assign a license model to a user with manufacturer, type, category, and active date range details.</p>
                </div>
            </header>

            <section class="inventoryShell inventoryFormShell inventoryFormCardShell">
                <form class="inventoryForm inventoryModelForm" id="licenseAssignForm">
                    <div id="licenseAssignStatus" class="inventoryStatusBanner formStatus" role="status" aria-live="polite"></div>
                    <div class="inventoryFormGrid">
                        <div class="formGroup">
                            <label for="licenseAssignUserInput">User</label>
                            <select id="licenseAssignUserInput" required></select>
                        </div>
                        <div class="formGroup">
                            <label for="licenseAssignModelInput">License Model</label>
                            <select id="licenseAssignModelInput" required></select>
                        </div>
                        <div class="formGroup">
                            <label for="licenseAssignManufacturerInput">Manufacturer</label>
                            <input id="licenseAssignManufacturerInput" type="text" placeholder="Auto-filled from selected license" readonly>
                        </div>
                        <div class="formGroup">
                            <label for="licenseAssignTypeInput">License Type</label>
                            <input id="licenseAssignTypeInput" type="text" placeholder="Auto-filled from selected license" readonly>
                        </div>
                        <div class="formGroup">
                            <label for="licenseAssignCategoryInput">Category</label>
                            <input id="licenseAssignCategoryInput" type="text" placeholder="Auto-filled from selected license" readonly>
                        </div>
                        <div class="formGroup">
                            <label for="licenseAssignStartDateInput">Start Date</label>
                            <input id="licenseAssignStartDateInput" type="date" required>
                        </div>
                        <div class="formGroup">
                            <label for="licenseAssignEndDateInput">End Date</label>
                            <input id="licenseAssignEndDateInput" type="date" required>
                        </div>
                    </div>
                    <div class="inventoryFormActions inventoryFormPageActions">
                        <button class="inventoryFormSecondaryBtn" type="reset">Reset</button>
                        <button class="inventoryFormPrimaryBtn" type="submit">Save</button>
                    </div>
                </form>
            </section>
        </section>
    </main>

    <script src="script/inventory-license-assign.js"></script>
</body>
</html>
