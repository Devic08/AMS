<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create User - AMS</title>
    <script src="script/theme-store.js?v=20260501a"></script>
    <script src="script/ams-database.js?v=20260502a"></script>
    <link rel="stylesheet" href="css/dashboard.css?v=20260501a">
    <link rel="stylesheet" href="css/sidebar-submenu.css">
    <link rel="stylesheet" href="css/inventory-assets.css">
    <link rel="stylesheet" href="css/predefined-fields.css">
    <link rel="stylesheet" href="css/theme-overrides.css?v=20260501a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <main class="inventoryFormPageMain">
        <section class="inventoryFormPageShell">
            <header class="predefinedHeader inventoryFormPageHeader">
                <a class="inventoryFormBackLink" href="people-all-users.html"><i class='bx bx-left-arrow-alt'></i><span>Back to All Users</span></a>
                <div>
                    <p class="predefinedEyebrow">People</p>
                    <h2>Create User</h2>
                    <p class="predefinedIntro">Add or update a user record for the People directory table.</p>
                </div>
            </header>

            <section class="inventoryShell inventoryFormShell inventoryFormCardShell">
                <form class="inventoryForm inventoryModelForm" id="peopleUserForm">
                    <div id="peopleUserFormStatus" class="inventoryStatusBanner formStatus" role="status" aria-live="polite"></div>
                    <div class="inventoryFormGrid">
                        <div class="formGroup">
                            <label for="userNameInput">User Name</label>
                            <input id="userNameInput" type="text" placeholder="Enter user name" required>
                        </div>
                        <div class="formGroup">
                            <label for="nameInput">Name</label>
                            <input id="nameInput" type="text" placeholder="Enter full name" required>
                        </div>
                        <div class="formGroup">
                            <label for="employeeCodeInput">Emp Code</label>
                            <input id="employeeCodeInput" type="text" placeholder="Enter emp code" required>
                        </div>
                        <div class="formGroup">
                            <label for="contactInput">Contact</label>
                            <input id="contactInput" type="text" placeholder="Enter contact number" required>
                        </div>
                        <div class="formGroup">
                            <label for="emailIdInput">EMail ID</label>
                            <input id="emailIdInput" type="email" placeholder="Enter email address" required>
                        </div>
                        <div class="formGroup">
                            <label for="departmentInput">Departments</label>
                            <input id="departmentInput" type="text" placeholder="Enter department" required>
                        </div>
                        <div class="formGroup">
                            <label for="designationInput">Designation</label>
                            <input id="designationInput" type="text" placeholder="Enter designation" required>
                        </div>
                        <div class="formGroup">
                            <label for="locationInput">Locations</label>
                            <input id="locationInput" type="text" placeholder="Enter location" required>
                        </div>
                        <div class="formGroup">
                            <label for="groupInput">Group</label>
                            <select id="groupInput">
                                <option value="">Select Group</option>
                            </select>
                        </div>
                        <div class="formGroup">
                            <label for="statusInput">Status</label>
                            <select id="statusInput" required>
                                <option value="Active">Active</option>
                                <option value="On Leave">On Leave</option>
                                <option value="Inactive">Inactive</option>
                            </select>
                        </div>
                    </div>
                    <div class="inventoryFormActions inventoryFormPageActions">
                        <button class="inventoryFormSecondaryBtn" type="reset">Reset</button>
                        <button class="inventoryFormPrimaryBtn" type="submit">Save</button>
                    </div>
                </form>
            </section>
        </section>
    </main>

    <script src="script/people-user-form.js?v=20260430b"></script>
</body>
</html>
