<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMS Register - Asset Management System</title>
    <link rel="stylesheet" type="text/css" href="css/register.css">
</head>
<body>
    <div class="pageShell">
        <div class="registerCard">
            <div class="registerHeader">
                <h1>Register</h1>
                <p>Create a new account to access the Asset Management System.</p>
            </div>

            <form class="registerForm" action="">
                <div class="formRow">
                    <div class="formGroup">
                        <label for="firstName">First Name</label>
                        <input id="firstName" type="text" placeholder="Enter first name" required>
                    </div>
                    <div class="formGroup">
                        <label for="lastName">Last Name</label>
                        <input id="lastName" type="text" placeholder="Enter last name" required>
                    </div>
                </div>

                <div class="formGroup">
                    <label for="email">Email Address</label>
                    <input id="email" type="email" placeholder="Enter email address" required>
                </div>

                <div class="formGroup">
                    <label for="username">Username</label>
                    <input id="username" type="text" placeholder="Choose a username" required>
                </div>

                <div class="formRow">
                    <div class="formGroup">
                        <label for="password">Password</label>
                        <input id="password" type="password" placeholder="Create password" required>
                    </div>
                    <div class="formGroup">
                        <label for="confirmPassword">Confirm Password</label>
                        <input id="confirmPassword" type="password" placeholder="Confirm password" required>
                    </div>
                </div>

                <div class="formGroup">
                    <label for="department">Department</label>
                    <input id="department" type="text" placeholder="Enter department" required>
                </div>

                <div class="termsRow">
                    <label>
                        <input type="checkbox" required>
                        I agree to the terms and conditions
                    </label>
                </div>

                <div class="buttonRow">
                    <button type="submit">Create Account</button>
                </div>

                <div class="bottomLink">
                    <p>Already have an account? <a href="login.html">Login</a></p>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
